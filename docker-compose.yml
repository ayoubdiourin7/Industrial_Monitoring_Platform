services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://monitoring:monitoring@postgres:5432/monitoring
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      MQTT_TOPIC: factory/+/metrics
    depends_on:
      - postgres
      - mosquitto
    ports:
      - "8000:8000"

  simulator:
    build:
      context: ./simulator
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      MQTT_TOPIC_PREFIX: factory
      PUBLISH_INTERVAL_SECONDS: "1"
    depends_on:
      - mosquitto

volumes:
  postgres_data:
